name: Deploy Jarodwr fork Pages

on:
  push:
    branches: [frontend-hooks]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fork-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Jarodwr/Onion'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust with the wasm32 target
        run: rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown

      - name: Install wasm-pack 0.15.0
        run: |
          set -eu
          curl -fsSL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Build Studio into the site
        working-directory: plugins/slot-onion/studio
        run: |
          wasm-pack build --release --target web --no-typescript --out-dir web/pkg
          sed -i "s/^const BUILD = 'dev';\$/const BUILD = '$GITHUB_SHA';/" web/studio.js
          mkdir -p ../../../pages/slot-studio
          cp -R web/. ../../../pages/slot-studio/
          cat > ../../../pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Onion Cart Studio</title>
          <meta http-equiv="refresh" content="0; url=slot-studio/">
          <p><a href="slot-studio/">Open Cart Studio</a></p>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - id: deploy
        uses: actions/deploy-pages@v4
